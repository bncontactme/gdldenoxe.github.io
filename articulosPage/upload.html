<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manda tu poema · GDN</title>
<link rel="stylesheet" href="../shared/win95.css">
<style>
  body {
    margin: 0; padding: 10px; background: var(--win95-teal);
    font: 11px var(--font-system); color: #000;
  }
  html.embed body { padding: 0; background: var(--win95-gray); }

  .win { max-width: 460px; margin: 0 auto; background: var(--win95-gray);
         border-top: var(--border-raised); border-left: var(--border-raised);
         border-right: var(--border-sunken); border-bottom: var(--border-sunken); }
  html.embed .win { max-width: none; border: none; }

  .bar { background: linear-gradient(90deg, var(--win95-blue), var(--win95-blue-light));
         color: #fff; font-weight: bold; padding: 2px 5px; }
  html.embed .bar { display: none; }

  .body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }

  label { display: block; font-weight: bold; margin-bottom: 1px; }
  .opt { font-weight: normal; color: #444; }

  input[type=text], textarea, select {
    width: 100%; box-sizing: border-box; padding: 2px 3px; font: 11px var(--font-system);
    background: #fff; border-top: var(--inset-light); border-left: var(--inset-light);
    border-right: var(--inset-dark); border-bottom: var(--inset-dark);
  }
  textarea { font-family: var(--font-mono); resize: vertical; }
  #texto { height: 130px; }

  .fila { display: flex; gap: 6px; }
  .fila > * { flex: 1; min-width: 0; }

  button {
    font: 11px var(--font-system); padding: 2px 10px; background: var(--win95-gray);
    border-top: var(--border-raised); border-left: var(--border-raised);
    border-right: var(--border-sunken); border-bottom: var(--border-sunken); cursor: pointer;
  }
  button:active:not(:disabled) { border-top: var(--border-sunken); border-left: var(--border-sunken);
                                 border-right: var(--border-raised); border-bottom: var(--border-raised); }
  button:disabled { color: var(--win95-dark-gray); cursor: default; }
  .acciones { display: flex; justify-content: flex-end; gap: 5px; }

  #fotos-lista { display: flex; flex-wrap: wrap; gap: 4px; }
  .foto { position: relative; }
  .foto img { width: 40px; height: 40px; object-fit: cover; display: block;
              border: 1px solid var(--win95-dark-gray); }
  .foto button { position: absolute; top: -3px; right: -3px; padding: 0; width: 13px; height: 13px;
                 line-height: 1; font-size: 9px; }

  #estado { min-height: 13px; }
  #estado.ok  { color: #060; font-weight: bold; }
  #estado.err { color: #900; font-weight: bold; }
  .oculto { display: none; }

  /* Puerta: la contraseña la valida el worker, aquí no se guarda ningún hash */
  #puerta { position: fixed; inset: 0; background: rgba(0,0,0,.45);
            display: flex; align-items: center; justify-content: center; z-index: 9; }
  #puerta .win { max-width: 260px; }
  #puerta.abierta { display: none; }
</style>
</head>
<body>
<div id="puerta">
  <div class="win">
    <div class="bar">Contraseña</div>
    <div class="body">
      <input type="password" id="pw" autocomplete="current-password" maxlength="120">
      <div id="pw-error" style="color:#900;min-height:13px"></div>
      <div class="acciones"><button type="button" id="pw-ok">Entrar</button></div>
    </div>
  </div>
</div>

<div class="win">
  <div class="bar">Manda tu poema · GDN</div>
  <div class="body">

    <div class="fila">
      <div><label for="titulo">Título</label><input type="text" id="titulo" maxlength="200"></div>
      <div><label for="autor">Tu nombre</label><input type="text" id="autor" maxlength="120"></div>
    </div>

    <div class="fila">
      <div>
        <label for="formato">Formato</label>
        <select id="formato">
          <option value="poema">Poema (centrado)</option>
          <option value="">Prosa</option>
        </select>
      </div>
      <div>
        <label for="categoria">Categoría</label>
        <select id="categoria">
          <option>Poesía</option><option>Crónica</option><option>Cuento</option>
          <option>Ensayo</option><option>Artículo</option>
        </select>
      </div>
    </div>

    <div>
      <label for="texto">Texto <span class="opt">— línea sola con --- para separar</span></label>
      <textarea id="texto"></textarea>
    </div>

    <div>
      <label>Imágenes <span class="opt">(opcional, hasta 12 · la primera es la portada)</span></label>
      <div class="acciones" style="justify-content:flex-start;margin-bottom:4px">
        <button type="button" id="btn-fotos">Agregar imágenes...</button>
      </div>
      <input type="file" id="fotos" accept="image/*" multiple class="oculto">
      <div id="fotos-lista"></div>
    </div>

    <div id="estado" role="status" aria-live="polite"></div>

    <div class="acciones">
      <button type="button" id="cancelar">Cancelar</button>
      <button type="button" id="enviar" disabled>Enviar a revisión</button>
    </div>

  </div>
</div>

<script>
(() => {
  'use strict';
  const WORKER = 'https://archivo-upload.guadalajaradenoxe.workers.dev';
  const MAX_MB = 10, MAX_FOTOS = 12;
  const $ = id => document.getElementById(id);

  if (new URLSearchParams(location.search).get('embed') === '1') {
    document.documentElement.classList.add('embed');
    new ResizeObserver(() => parent.postMessage(
      { type: 'articulo-upload-resize', height: document.body.offsetHeight }, location.origin
    )).observe(document.body);
  }

  let fotos = [];
  let clave = '';   // vive solo en memoria, no se guarda en ningún lado

  // ── Puerta ─────────────────────────────────────────────────────────────────
  const entrar = async () => {
    const intento = $('pw').value;
    if (!intento) return;
    $('pw-ok').disabled = true;
    $('pw-error').textContent = '';
    try {
      await pedir({ action: 'ping', password: intento });
      clave = intento;
      $('pw').value = '';
      $('puerta').classList.add('abierta');
      $('titulo').focus();
    } catch (e) {
      $('pw-error').textContent = e.message === 'Unauthorized' ? 'Contraseña incorrecta.' : e.message;
    } finally {
      $('pw-ok').disabled = false;
    }
  };
  $('pw-ok').addEventListener('click', entrar);
  $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  $('pw').focus();

  // Línea en blanco = párrafo nuevo; línea con --- = separador. Los saltos
  // dentro de una estrofa se conservan tal cual.
  const parsear = raw => {
    const bloques = []; let buf = [];
    const cerrar = () => { const t = buf.join('\n'); if (t.trim()) bloques.push({ tipo: 'p', texto: t }); buf = []; };
    String(raw || '').replace(/\r\n?/g, '\n').split('\n').forEach(l => {
      if (/^\s*$/.test(l)) cerrar();
      else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { cerrar(); bloques.push({ tipo: 'hr', texto: '' }); }
      else buf.push(l);
    });
    cerrar();
    return bloques;
  };

  const listo = () => $('titulo').value.trim() && $('autor').value.trim() && parsear($('texto').value).length;
  const sync = () => { $('enviar').disabled = !listo(); };
  ['titulo', 'autor', 'texto'].forEach(id => $(id).addEventListener('input', sync));

  const decir = (msg, clase) => { $('estado').textContent = msg; $('estado').className = clase || ''; };

  // ── Imágenes ───────────────────────────────────────────────────────────────
  $('btn-fotos').addEventListener('click', () => $('fotos').click());
  $('fotos').addEventListener('change', e => { agregar(e.target.files); e.target.value = ''; });

  function agregar(files) {
    for (const f of files) {
      if (fotos.length >= MAX_FOTOS) break;
      if (!f.type.startsWith('image/')) { decir('Solo imágenes.', 'err'); continue; }
      if (f.size > MAX_MB * 1024 * 1024) { decir(f.name + ' pasa de ' + MAX_MB + ' MB.', 'err'); continue; }
      const item = { file: f, url: '' };
      const r = new FileReader();
      r.onload = ev => { item.url = ev.target.result; pintarFotos(); };
      r.readAsDataURL(f);
      fotos.push(item);
    }
    pintarFotos();
  }

  function pintarFotos() {
    const lista = $('fotos-lista');
    lista.textContent = '';
    fotos.forEach((f, i) => {
      const caja = document.createElement('div');
      caja.className = 'foto';
      const img = document.createElement('img'); img.src = f.url || ''; img.alt = '';
      const x = document.createElement('button'); x.type = 'button'; x.textContent = '×';
      x.title = 'Quitar';
      x.addEventListener('click', () => { fotos.splice(i, 1); pintarFotos(); });
      caja.append(img, x);
      lista.appendChild(caja);
    });
  }

  // ── Enviar ─────────────────────────────────────────────────────────────────
  $('enviar').addEventListener('click', enviar);
  $('cancelar').addEventListener('click', () => {
    if (parent !== window) parent.postMessage({ type: 'close-articulo-upload' }, location.origin);
    else if (history.length > 1) history.back();
  });

  async function enviar() {
    if (!listo()) return;
    $('enviar').disabled = true; $('cancelar').disabled = true;

    const autor = $('autor').value.trim();
    const titulo = $('titulo').value.trim();

    try {
      // Las imágenes primero: así el texto ya entra a la cola con sus fotos
      // colgadas y el admin lo ve completo de una.
      const uuid = crypto.randomUUID();
      const contenido = parsear($('texto').value);
      let portada = '';

      for (let i = 0; i < fotos.length; i++) {
        decir('Subiendo imagen ' + (i + 1) + ' de ' + fotos.length + '…');
        const url = await subir(fotos[i].file, uuid, autor, titulo);
        if (i === 0) portada = url; else contenido.push({ tipo: 'img', url });
      }

      decir('Enviando…');
      await pedir({
        action: 'articulo-propose', password: clave,
        articulo: {
          uuid, titulo, autor, clase: $('formato').value,
          meta: [autor, $('categoria').value].filter(Boolean).join(' • '),
          imagen: portada, contenido,
        },
      });


      decir('✓ Listo. Tu texto quedó en revisión.', 'ok');
      $('titulo').value = ''; $('texto').value = ''; fotos = []; pintarFotos();
    } catch (e) {
      decir('No se pudo enviar: ' + e.message, 'err');
    } finally {
      $('cancelar').disabled = false;
      sync();
    }
  }

  async function pedir(cuerpo) {
    const res = await fetch(WORKER, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cuerpo),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  async function subir(file, uuid, autor, titulo) {
    const p = await pedir({
      action: 'articulo-sign', password: clave, uuid, autor, titulo, content_type: file.type,
    });
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', p.upload_preset);
    fd.append('folder', p.folder);
    fd.append('asset_folder', p.asset_folder || p.folder);
    fd.append('timestamp', p.timestamp);
    fd.append('api_key', p.api_key);
    fd.append('signature', p.signature);
    if (p.context) fd.append('context', p.context);

    const up = await fetch('https://api.cloudinary.com/v1_1/' + p.cloud_name + '/image/upload',
      { method: 'POST', body: fd });
    const cloud = await up.json().catch(() => ({}));
    if (!up.ok || !cloud.secure_url) throw new Error('Cloudinary rechazó la imagen');
    return cloud.secure_url;
  }

  sync();
})();
</script>
</body>
</html>
